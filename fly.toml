# fly.toml app configuration file generated for portugiesisch-lern-pwa on 2026-10-04T14:22:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "portugiesisch-lern-pwa"
primary_region = "fra"

[build]
  builder = "docker"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 3000

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 900

  [[services.ports]]
    number = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    number = 443
    handlers = ["tls", "http"]

  [services.tcp_checks]
    interval = 10000
    grace_period = "5s"
    timeout = 2000
